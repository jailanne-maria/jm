<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="120" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
  </defs>

  <!-- Tronco -->
  <rect x="92" y="110" width="16" height="55" rx="8" fill="url(#logoGrad)"/>

  <!-- Galhos -->
  <rect x="56" y="110" width="16" height="12" rx="6" fill="url(#logoGrad)" transform="rotate(-35 64 116)"/>
  <rect x="128" y="110" width="16" height="12" rx="6" fill="url(#logoGrad)" transform="rotate(35 136 116)"/>

  <!-- Copa - triângulo estilizado como píxels (tech) -->
  <polygon points="100,20 40,115 160,115" fill="none" stroke="url(#logoGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Nós de conexão (tech) dentro da copa -->
  <circle cx="100" cy="55" r="9" fill="url(#logoGrad)"/>
  <circle cx="68" cy="92" r="7" fill="url(#logoGrad)"/>
  <circle cx="132" cy="92" r="7" fill="url(#logoGrad)"/>
  <circle cx="84" cy="78" r="5" fill="url(#logoGrad)"/>
  <circle cx="116" cy="78" r="5" fill="url(#logoGrad)"/>

  <!-- Conexões (circuitos) entre nós -->
  <line x1="100" y1="55" x2="84" y2="78" stroke="url(#logoGrad)" stroke-width="3"/>
  <line x1="100" y1="55" x2="116" y2="78" stroke="url(#logoGrad)" stroke-width="3"/>
  <line x1="84" y1="78" x2="68" y2="92" stroke="url(#logoGrad)" stroke-width="3"/>
  <line x1="116" y1="78" x2="132" y2="92" stroke="url(#logoGrad)" stroke-width="3"/>

  <!-- Raízes tecnológicas -->
  <line x1="100" y1="165" x2="74" y2="185" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="165" x2="126" y2="185" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Ponto de código (terminal) -->
  <rect x="92" y="172" width="16" height="5" rx="2.5" fill="url(#logoGrad)"/>
</svg>
